<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="app.css">
    <title>Escapa de Taylor Swift</title>
    <link href="https://fonts.cdnfonts.com/css/phobia-night" rel="stylesheet">
</head>
<body>

    <h1>Escapa de Taylor Swift</h1>

    <div id="panel">
        <label>
            Velocidad player: <span id="player-speed-text">4</span>
            <input type="range" id="player-speed" min="1" max="10" value="4">
        </label>

        <label>
            Velocidad Taylor: <span id="taylor-speed-text">1</span>
            <input type="range" id="taylor-speed" min="1" max="10" value="1">
        </label>

        <div>
            Taylors: <span id="taylor-count">1</span>
            <button id="remove-taylor">-</button>
            <button id="add-taylor">+</button>
        </div>

        <div>Tiempo: <span id="timer">0</span> s</div>

        <button id="play-button">Play</button>
    </div>

    <div id="game-area">
        <div id="player" class="character"></div>
        <div id="goal"></div>
    </div>

    <footer id="footer">
        <p>
            Si una swiftie extremista pregunta, esta pagina es anonima.
        </p>
        <p>
            Pero si no, somos: <br>
            <strong>
                Leidy Miriam Morayta Perez <br>  
                Laura Lucia Jaramillo Yah <br>
                ≧◔◡◔≦
            </strong>
        </p>
    </footer>

    <script type="text/javascript" src="app.js"></script>

</body>
</html>
